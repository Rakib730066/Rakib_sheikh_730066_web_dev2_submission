services:
  # Nginx reverse proxy
  nginx:
    image: nginx:alpine
    container_name: event_app_nginx
    ports:
      - "80:80"
    volumes:
      - ./backend/nginx.conf:/etc/nginx/conf.d/default.conf
      - ./backend/app/public:/app/public
    depends_on:
      php:
        condition: service_started
    networks:
      - event-network
    environment:
      - TZ=UTC

  # PHP-FPM application server
  php:
    build:
      context: ./backend
      dockerfile: PHP.Dockerfile
    container_name: event_app_php
    working_dir: /app
    volumes:
      - ./backend/app:/app
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - event-network
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - DB_NAME=developmentdb
      - DB_USER=developer
      - DB_PASSWORD=secret123
      - JWT_SECRET=your-super-secret-jwt-key-change-in-production
      - APP_DEBUG=true
      - TZ=UTC

  # MySQL database
  mysql:
    image: mysql:8.0
    container_name: event_app_mysql
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: developmentdb
      MYSQL_USER: developer
      MYSQL_PASSWORD: secret123
      TZ: UTC
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/database/schema.sql:/docker-entrypoint-initdb.d/schema.sql
    networks:
      - event-network
    ports:
      - "3306:3306"
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost
    container_name: event_app_frontend
    ports:
      - "5173:80"
    depends_on:
      - nginx
    networks:
      - event-network

volumes:
  mysql_data:

networks:
  event-network:
    driver: bridge
